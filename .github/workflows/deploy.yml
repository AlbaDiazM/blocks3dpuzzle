name: Copiar web y publicar en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  copiar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar copia estática de la web
        run: |
          wget --mirror --page-requisites --adjust-extension --convert-links \
            --no-parent --restrict-file-names=windows --span-hosts \
            --domains=www.blocks3dpuzzle.com,blocks3dpuzzle.com \
            --reject-regex '(\?replytocom=|wp-json|xmlrpc|/feed/|wp-login|\?p=|\?s=|\?id=|com/.+www\.|viewtopic|forum|\.ru/|0pk\.me|borda\.|\?share=|\?like)' \
            -e robots=off --tries=1 --timeout=15 \
            --user-agent="Mozilla/5.0 (migracion del propietario)" \
            https://www.blocks3dpuzzle.com/ || true

          # Comprobar que la portada se descargó
          test -f www.blocks3dpuzzle.com/index.html

          mv www.blocks3dpuzzle.com _site

          # Dominio personalizado para GitHub Pages
          echo "www.blocks3dpuzzle.com" > _site/CNAME

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
