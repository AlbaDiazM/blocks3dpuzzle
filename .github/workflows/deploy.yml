name: Copiar web y publicar en GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  copiar-y-publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar copia estática de la web
        run: |
          wget --mirror --page-requisites --adjust-extension --convert-links \
            --no-parent --restrict-file-names=windows --span-hosts \
            --domains=www.blocks3dpuzzle.com,blocks3dpuzzle.com \
            --reject-regex '(\?replytocom=|wp-json|xmlrpc|/feed/|wp-login|\?p=|\?s=|\?id=|com/.+www\.|viewtopic|forum|\.ru/|0pk\.me|borda\.|\?share=|\?like|/category/|/tag/|/author/|tienda-de-puzzles)' \
            -e robots=off --tries=1 --timeout=15 \
            --user-agent="Mozilla/5.0 (migracion del propietario)" \
            https://www.blocks3dpuzzle.com/ || true

          # Comprobar que la portada se descargó
          test -f www.blocks3dpuzzle.com/index.html

          mv www.blocks3dpuzzle.com _site

      - name: Quitar blog y tienda
        run: |
          rm -rf _site/category _site/tienda-de-puzzles _site/tag _site/author

          # Quitar los enlaces de Blog y Tienda del menú de todas las páginas
          find _site -name '*.html' -print0 | xargs -0 perl -0pi -e 's/<li[^>]*>(?:(?!<\/li)(?!<li).)*?(?:category\/|tienda-de-puzzles)(?:(?!<\/li).)*?<\/li>//gs'

          # Quitar submenús que hayan quedado vacíos
          find _site -name '*.html' -print0 | xargs -0 perl -0pi -e 's/<ul[^>]*>\s*<\/ul>//gs'

          # Quitar el menú Contact
          find _site -name '*.html' -print0 | xargs -0 perl -0pi -e 's/<li[^>]*>(?:(?!<\/li)(?!<li).)*?(?:page_id=123|>Contact<)(?:(?!<\/li).)*?<\/li>//gs'

          # Quitar flechas de submenús que ya no existen
          find _site -name '*.html' -print0 | xargs -0 perl -0pi -e 's/menu-item-has-children//g'

          # Eliminar páginas sueltas: solo quedan portada, español y páginas legales
          cd _site
          for d in */ ; do
            case "$d" in
              wp-content/|wp-includes/|blocks-puzzle-3d/|privacy-policy/|politica-de-cookies/) ;;
              *) rm -rf "$d" ;;
            esac
          done
          cd ..

          # Añadir correo de contacto al pie de todas las páginas
          find _site -name '*.html' -print0 | xargs -0 perl -0pi -e 's/<\/body>/<div style="text-align:center;padding:16px;font-size:14px;background:#f0f0f0">Contacto: <a href="mailto:trendmobgames\@gmail.com">trendmobgames\@gmail.com<\/a><\/div><\/body>/'


      - name: Eliminar comentarios de spam
        run: |
          python3 - <<'EOF'
          import re, pathlib
          for p in pathlib.Path('_site').rglob('*.html'):
              s = p.read_text(errors='ignore')
              i = s.find('id="comments"')
              if i < 0:
                  continue
              start = s.rfind('<', 0, i)
              depth = 0
              j = None
              for m in re.finditer(r'<div\b|</div>', s[start:]):
                  depth += 1 if m.group(0) == '<div' else -1
                  if depth == 0:
                      j = start + m.end()
                      break
              if j:
                  p.write_text(s[:start] + s[j:])
                  print('limpiado:', p)
          EOF

      - name: Guardar y publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
